<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="sign-in-container">
        <form id="sign-in-form">
            <div id="sign-in-name-container">
                <label for="sign-in-name-field">Name</label>
                <input id="sign-in-name-field" type="text"/>
            </div>
            <div id="sign-in-password-container">
                <label for="sign-in-password-field">Name</label>
                <input id="sign-in-password-field" type="password"/>
            </div>
            <div id="sign-in-role-container">
                <label for="sign-in-role-field">Name</label>
                <input id="sign-in-role-field" type="text"/>
            </div>
            <button id="sign-in-submit" type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
